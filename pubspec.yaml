name: chess_mortem
description: "Free, private chess game analysis on your phone: Stockfish verdicts, plain-English coach lines, and what-if moves."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  chessground: ^10.1.1
  crypto: ^3.0.3
  dartchess: ^0.13.1
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.0.10
  http: ^1.2.0
  multistockfish: ^0.5.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.3
  audioplayers: ^6.8.1

# chessground with only the piece sets the app offers: Flutter would bundle
# all 40 of the published package's sets, most of which may not be
# redistributed in a GPL app (third_party/chessground/pubspec.yaml).
dependency_overrides:
  chessground:
    path: third_party/chessground

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Regenerate with `dart run flutter_launcher_icons` after changing either PNG.
# Both PNGs are rendered from the SVG beside them and never hand-edited.
flutter_launcher_icons:
  android: true
  ios: true
  # Full bleed, square and opaque: every launcher applies its own mask, and an
  # alpha channel here is what iOS rejects.
  image_path: "assets/logo.png"
  # The background is this flat colour rather than a file so it cannot drift
  # from the ink in the artwork. The foreground is the same mark, transparent
  # and inset to clear Android's safe zone — see assets/logo_foreground.svg.
  adaptive_icon_background: "#14152A"
  adaptive_icon_foreground: "assets/logo_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/game.pgn
    # Generated by `dart run scripts/build_opening_book.dart` — never hand-edited.
    - assets/openings.bin
    - assets/logo.svg
    # Kenney's "Impact Sounds" (CC0; assets/sounds/LICENSE.txt).
    - assets/sounds/move.ogg
    - assets/sounds/capture.ogg
    - assets/sounds/check.ogg
