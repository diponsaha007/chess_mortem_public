# Vendored copy of chessground 10.1.1 (GPL-3.0) for ChessMortem.
# The only change: the piece sets ChessMortem does not offer are removed,
# here and in assets/piece_sets/. Flutter bundles every asset a package
# lists, and those sets are non-commercial, "freeware" or unlicensed, so
# they may not ship in a GPL app. To upgrade: copy the new
# release over this folder and remove the same sets again.
name: chessground
description: Chess board UI developed for lichess.org. It has no chess logic inside so it can be used for chess variants.
version: 10.1.1
repository: https://github.com/lichess-org/flutter-chessground
funding:
  - https://lichess.org/patron

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: ">=3.29.0"

dependencies:
  dartchess: ^0.13.1
  flutter:
    sdk: flutter
  meta: ^1.18.0

flutter:
  assets:
    - assets/piece_sets/cburnett/
    - assets/piece_sets/celtic/
    - assets/piece_sets/chessnut/
    - assets/piece_sets/fantasy/
    - assets/piece_sets/firi/
    - assets/piece_sets/kiwen-suwi/
    - assets/piece_sets/letter/
    - assets/piece_sets/merida/
    - assets/piece_sets/mpchess/
    - assets/piece_sets/pirouetti/
    - assets/piece_sets/pixel/
    - assets/piece_sets/rhosgfx/
    - assets/piece_sets/shapes/
    - assets/piece_sets/spatial/
    - assets/piece_sets/totoy/
    - assets/boards/
